[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alma3"
version = "3.0.0"
description = "ALMA3 foundation and diagnostic inference"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "ALMA Genomics" }]
license = { file = "LICENSE" }
dependencies = [
  "torch==2.7.0",
  "safetensors==0.8.0",
  "numpy==1.26.4",
  "filelock==3.29.0"
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.5"
]

[project.scripts]
alma3 = "alma3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alma3 = ["schemas/*.json", "release_catalog.json"]

[tool.ruff]
line-length = 120
target-version = "py310"
